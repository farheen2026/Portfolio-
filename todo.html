<!DOCTYPE html>
<html>
<head>
  <title>To-Do App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{text-align:center;font-family:Arial;background:#0b1220;color:white;}
    input{padding:10px;width:60%;}
    button{padding:10px;}
    li{background:#1f2937;margin:10px auto;width:60%;padding:10px;border-radius:8px;}
  </style>
</head>
<body>

<h1>📝 To-Do App</h1>

<input id="task" placeholder="Enter task">
<button onclick="add()">Add</button>

<ul id="list"></ul>

<script>
function add(){
  let task=document.getElementById("task").value;
  if(task==="") return;

  let li=document.createElement("li");
  li.innerHTML=task;
  document.getElementById("list").appendChild(li);

  document.getElementById("task").value="";
}
</script>

</body>
</html>
